[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernize for target-version)
    "B",   # flake8-bugbear (likely-bug patterns)
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length is handled by the formatter, not worth failing the build over
]

[tool.bandit]
exclude_dirs = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
# Scoped to the type-hinted files. make_instance.py's own body is untyped
# (untested-at-the-function-level orchestration code; see CLAUDE.md) but
# mypy still infers most of its ~80 local variables correctly from the
# real type hints on every function it calls -- so it's included here too,
# checked as-is with no annotations of its own beyond parse_args()/main()'s
# own signatures. access_instance.py is now fully typed (converted from a
# flat script into dependency-injected functions, same as manage_instance.py).
files = ["access_instance.py", "aux_data.py", "instance_builder.py", "make_instance.py", "manage_instance.py", "scripts/lint_templates.py", "template_engine.py"]
# boto3/botocore ARE stubbed (boto3-stubs[ec2,iam,sns,sts,logs] --
# requirements-test.txt, a dev-only dependency; real importable runtime
# modules, not stub-only, so EC2Client/IAMClient/etc. are used directly as
# types, not faked as Any). jinja2/prettytable/yaml have no stubs and
# aren't worth adding one for -- this only silences "missing library
# stubs" for those, not real errors in this codebase's own code.
ignore_missing_imports = true
